<body class="login-body"><a class="back-home" href="/">← <span>Back to home</span></a><main class="login-layout"><section class="login-brand-panel"><a class="brand brand-large" href="/"><img src="/assets/raptor-eagle-mark.png" alt=""><span>RAPTOR<small>ESPORTS</small></span></a><p class="brand-motto">Manage <i>•</i> Organize <i>•</i> Compete <i>•</i> Grow</p><div class="login-orbit orbit-one"></div><div class="login-orbit orbit-two"></div></section><section class="login-form-panel"><form id="login-form" class="login-form" novalidate><span class="eyebrow">ADMIN PORTAL</span><h1>Welcome Back</h1><p class="muted">Login to your account</p><label for="identity">Email or Username</label><div class="input-wrap"><span aria-hidden="true">♙</span><input id="identity" name="identity" type="text" autocomplete="username" placeholder="admin@raptor.local" required></div><label for="password">Password</label><div class="input-wrap"><span aria-hidden="true">♙</span><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required><button id="password-toggle" class="input-action" type="button" aria-label="Show password">◉</button></div><div class="login-options"><label class="remember"><input type="checkbox" name="remember"><span>Remember me</span></label><a href="mailto:hello@raptoresports.local?subject=Password%20reset">Forgot password?</a></div><p id="login-error" class="form-message" role="alert" aria-live="polite"></p><button id="login-submit" class="button button-purple login-submit" type="submit">Login</button><p class="login-contact">Don’t have an account? <a href="mailto:hello@raptoresports.local">Contact Admin</a></p></form></section></main></body></html>
