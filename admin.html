<body class="admin-body">

    <symbol id="icon-users" viewBox="0 0 24 24"><path d="M16 21v-1.8a4.2 4.2 0 0 0-4.2-4.2H6.2A4.2 4.2 0 0 0 2 19.2V21"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-1.8a4.2 4.2 0 0 0-3.1-4.1"/><path d="M16.5 3.2a4 4 0 0 1 0 7.6"/></symbol>

    <symbol id="icon-activity" viewBox="0 0 24 24"><path d="M3 12h4l2.5-7 5 14L17 12h4"/></symbol>
    <symbol id="icon-trophy" viewBox="0 0 24 24"><path d="M8 21h8M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0V4Z"/><path d="M7 6H4v1a4 4 0 0 0 4 4M17 6h3v1a4 4 0 0 1-4 4"/></symbol>

  <div class="admin-shell">
    <aside id="sidebar" class="sidebar">
      <a class="brand sidebar-brand" href="/">
        <img src="/assets/team-raptor-mark.png" alt="">
        <span>RAPTOR<small>ESPORTS</small></span>
      </a>
      <nav class="side-nav" aria-label="Workspace navigation">
        <span class="nav-caption">WORKSPACE</span>
        <a href="#dashboard" data-page="dashboard" class="side-link active" data-permission="analytics.view"><svg class="ui-icon" aria-hidden="true"><use href="#icon-dashboard"></use></svg><span>Dashboard</span></a>
        <a href="#players" data-page="players" class="side-link" data-permission="roster.view"><svg class="ui-icon" aria-hidden="true"><use href="#icon-user"></use></svg><span>Players</span></a>
        <a href="#teams" data-page="teams" class="side-link" data-permission="teams.view_all"><svg class="ui-icon" aria-hidden="true"><use href="#icon-shield"></use></svg><span>Teams</span></a>
        <a href="#performance_records" data-page="performance_records" class="side-link" data-permission="performance.view_all"><svg class="ui-icon" aria-hidden="true"><use href="#icon-activity"></use></svg><span>Performance</span></a>
        <a href="#tournaments" data-page="tournaments" class="side-link" data-permission="matches.view_all"><svg class="ui-icon" aria-hidden="true"><use href="#icon-trophy"></use></svg><span>Competitions</span></a>
        <a href="#matches" data-page="matches" class="side-link" data-permission="matches.view_all"><svg class="ui-icon" aria-hidden="true"><use href="#icon-flag"></use></svg><span>Matches</span></a>
        <a href="#reports" data-page="reports" class="side-link" data-permission="reports.view"><svg class="ui-icon" aria-hidden="true"><use href="#icon-chart"></use></svg><span>Reports</span></a>
        <a href="#expenses" data-page="expenses" class="side-link" data-permission="financial.view"><svg class="ui-icon" aria-hidden="true"><use href="#icon-receipt"></use></svg><span>Expenses</span></a>
        <a href="#assignments" data-page="assignments" class="side-link" data-permission="teams.assign_coaches"><svg class="ui-icon" aria-hidden="true"><use href="#icon-user-check"></use></svg><span>Coach Assignments</span></a>
        <a href="#users" data-page="users" class="side-link" data-permission="users.view_all"><svg class="ui-icon" aria-hidden="true"><use href="#icon-users"></use></svg><span>Users</span></a>
        <span class="nav-caption nav-caption-second">PREFERENCES</span>
        <a href="#settings" data-page="settings" class="side-link" data-permission="system.configure"><svg class="ui-icon" aria-hidden="true"><use href="#icon-settings"></use></svg><span>Settings</span></a>
      </nav>
      <button id="logout-button" class="logout-button"><svg class="ui-icon" aria-hidden="true"><use href="#icon-logout"></use></svg><span>Logout</span></button>
    </aside>
    <button id="sidebar-backdrop" class="sidebar-backdrop" type="button" aria-label="Close navigation"></button>

    <main class="admin-main">
      <header class="admin-topbar">
        <button id="sidebar-toggle" class="icon-button sidebar-toggle" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false"><svg class="ui-icon" aria-hidden="true"><use href="#icon-menu"></use></svg></button>
        <div class="breadcrumbs"><a href="/">Raptor</a><span>/</span><strong id="crumb-current">Dashboard</strong></div>
        <div class="topbar-actions">
          <button class="icon-button notification-button" aria-label="Notifications"><svg class="ui-icon" aria-hidden="true"><use href="#icon-bell"></use></svg><i></i></button>
          <button class="profile-button" aria-label="Signed in account"><span class="avatar">A</span><span class="profile-name">Account</span><span class="role-badge" id="profile-role"></span></button>
        </div>
      </header>
      <div id="admin-content" class="admin-content" aria-live="polite"><div class="loading-state">Loading your workspace…</div></div>
    </main>
  </div>

  <dialog id="record-dialog" class="record-dialog" aria-labelledby="dialog-title">
    <form id="record-form" method="dialog">
      <div class="dialog-heading">
        <div><span class="eyebrow">RAPTOR MANAGEMENT</span><h2 id="dialog-title">Add record</h2></div>
        <button class="dialog-close" value="cancel" aria-label="Close">×</button>
      </div>
      <div id="form-fields" class="form-fields"></div>
      <p id="dialog-error" class="form-message" role="alert"></p>
      <div class="dialog-actions">
        <button class="button button-light" value="cancel" formnovalidate>Cancel</button>
        <button id="save-record" class="button button-purple" value="default">Save changes</button>
      </div>
    </form>
  </dialog>
</body>
</html>
